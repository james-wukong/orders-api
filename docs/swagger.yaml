basePath: /api/v1
definitions:
  dto.CreateRestaurantRequest:
    properties:
      address:
        type: string
      banner_url:
        type: string
      city:
        type: string
      closing_time:
        type: string
      country:
        type: string
      delivery_fee:
        type: number
      description:
        type: string
      email:
        type: string
      estimated_delivery_time:
        type: integer
      latitude:
        type: number
      logo_url:
        type: string
      longitude:
        type: number
      minimum_order:
        type: number
      name:
        minLength: 3
        type: string
      opening_time:
        description: |-
          We use pointers for fields with DB defaults so we don't
          accidentally overwrite the default with a zero-value.
        type: string
      phone:
        type: string
      postal_code:
        type: string
      slug:
        type: string
      state:
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      role:
        enum:
        - customer
        - admin
        - kitchen
        - delivery
        - inventory_manager
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      session_info:
        $ref: '#/definitions/dto.SessionInfo'
      token:
        type: string
    type: object
  dto.RestaurantResponse:
    properties:
      address:
        type: string
      city:
        type: string
      closing_time:
        type: string
      created_at:
        type: string
      description:
        type: string
      email:
        type: string
      id:
        type: string
      is_open:
        type: boolean
      name:
        type: string
      opening_time:
        type: string
      phone:
        type: string
      rating:
        type: number
      slug:
        type: string
      state:
        type: string
      total_reviews:
        type: integer
    type: object
  dto.SessionInfo:
    properties:
      client_device:
        type: string
      expires_at:
        type: string
      ip_address:
        type: string
      operating_system:
        type: string
      user_agent:
        type: string
      user_id:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login:
        type: string
      last_name:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8082
