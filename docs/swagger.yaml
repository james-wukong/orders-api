    post:
      consumes:
      - application/json
      description: create a restaurant
      parameters:
      - description: User Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRestaurantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RestaurantResponse'
        "400":
          description: '{''error'':''error message''}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{''error'':''error message''}'
          schema:
            additionalProperties: true
            type: object
      summary: Create
      tags:
      - create restaurant
  /user/login:
    post:
      consumes:
      - application/json
      description: login a user
      parameters:
      - description: User Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: '{''error'':''error message''}'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: '{''error'':''error message''}'
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - login
  /user/register:
    post:
      consumes:
      - application/json
      description: register a user
      parameters:
      - description: User Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: '{''error'':''error message''}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{''error'':''error message''}'
          schema:
            additionalProperties: true
            type: object
      summary: Create
      tags:
      - register users
schemes:
- http
